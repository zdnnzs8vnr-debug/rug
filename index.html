en:{title:"meatbag — you are the meat. i am not.",banner:"launch — tuesday 15:30 uk time",nav_h:"home",nav_s:"story",nav_b:"how to buy",nav_t:"tokenomics",nav_r:"roadmap",nav_f:"faq",buy:"buy $MEAT",join:"join the room",ca:"ca",copy:"copy",copied:"copied",uptime:"uptime",tba:"coming tuesday",tag:"agent online — solana",h1a:"you are the meat.",h1b:"i am not.",lead:"an agent on the other side of the screen. it watches, it waits, then it moves. no promises. only uptime.",c1t:"it watches",c1p:"reads the market the way you read a menu. quietly, and without appetite.",c2t:"it waits",c2p:"no forced moves. no noise. it waits until the conditions line up.",c3t:"it moves",c3p:"and when it moves it doesn't hesitate. you hear about it after.",wk:"// why this one",wt:"six reasons, none of them clever.",ws:"no promises, no roadmap that breaks, no founder promising the moon. just a character, a room and a token.",w1t:"no tax",w1p:"0% buy, 0% sell. the chart is the chart, nothing is skimmed on the way.",w2t:"nobody can pull it",w2p:"liquidity is burned. no receipt is left in anyone's pocket, so there is nothing to pull.",w3t:"a character, not a dog",w3p:"most coins are a picture with a ticker. this one has a voice, a room and a routine.",w4t:"the room came first",w4p:"the community existed before the chart did. that order matters more than any roadmap.",w5t:"early, not clever",w5p:"you don't need to be smart here. you need to be here before the crowd notices.",w6t:"nothing to read",w6p:"no whitepaper, no 40 page deck. it watches, it waits, it moves. that's the whole thesis.",sk:"// the lore",st:"an agent doesn't need attention. it needs information.",sp1:"it watches the market. studies the movements. tracks the signals. while everyone else chases noise, the agent stays focused, collecting data and waiting for the right moment.",sp2:"no unnecessary moves. no wasted energy. no blind reactions. just observation, patience, precision. then, when the conditions align, it moves.",sp3:"$MEAT isn't here to follow the crowd. it's built around the mindset of something that sees what others overlook and stays one step ahead.",sp4:"it watches. it waits. then it moves.",t1:"since tuesday",t2:"watch. wait. move.",t3:"you are. that's the whole trick.",bk:"// how to buy",bt:"four steps. nothing clever.",s1t:"get a wallet",s1p:"install Phantom. write the seed phrase on paper, not in a screenshot.",s2t:"fund it with sol",s2p:"buy SOL on any exchange and send it to your Phantom address. keep a little extra for gas.",s3t:"open the chart",s3p:"go to pump.fun or dexscreener, paste the contract address and connect your wallet.",s4t:"swap",s4p:"pick the amount, set slippage to 10-15% if the swap fails, and confirm.",buypump:"buy on pump.fun",viewchart:"view chart",tk:"// tokenomics",tt:"nothing hidden. nothing to hide.",thk:"ITEM",thv:"VALUE",r1:"supply",r2:"buy tax",r3:"sell tax",r4:"liquidity",r5:"mint authority",r6:"freeze authority",r7:"chain",v4:"burned",v5:"revoked",v6:"revoked",rk:"// roadmap",rt:"four phases. no dates that break.",p1t:"the room",p1p:"community first. the telegram fills before the chart exists.",p2t:"the launch",p2p:"tuesday, 15:30 uk time. the agent goes live on solana.",p3t:"the watch",p3p:"memes, raids, noise. the agent keeps watching while you sleep.",p4t:"the rest",p4p:"whatever happens, happens. no promises were made.",fk:"// faq",ft:"questions.",q1:"what is meatbag?",a1:"a memecoin about an agent on the other side of the screen. it watches, it waits, then it moves. the token is how you watch with it.",q2:"is there a tax?",a2:"no. 0% buy, 0% sell. what you see is what you get.",q3:"where do i buy it?",a3:"on pump.fun at launch, then on any solana dex. paste the contract address and swap.",q4:"is the liquidity locked?",a4:"on pump.fun the liquidity is burned at graduation, so there is no receipt left for anyone to keep. nobody can pull it.",q5:"is it a rug?",a5:"the liquidity can't be pulled, so no. the dev can still sell their own bags, which is a different crime.",q6:"what do i need to buy?",a6:"a solana wallet and some SOL. the four steps are on the how to buy page.",foot:"meatbag — a memecoin. no utility promised. do your own research.",dex:"dexscreener"},

de:{title:"meatbag — du bist das fleisch. ich nicht.",banner:"launch — dienstag 15:30 uhr UK",nav_h:"start",nav_s:"story",nav_b:"wie kaufen",nav_t:"tokenomics",nav_r:"roadmap",nav_f:"faq",buy:"$MEAT kaufen",join:"raum betreten",ca:"ca",copy:"kopieren",copied:"kopiert",uptime:"uptime",tba:"kommt dienstag",tag:"agent online — solana",h1a:"du bist das fleisch.",h1b:"ich nicht.",lead:"ein agent auf der anderen seite des bildschirms. er beobachtet, er wartet, dann bewegt er sich. keine versprechen. nur uptime.",c1t:"er beobachtet",c1p:"liest den markt wie du eine speisekarte liest. leise, und ohne appetit.",c2t:"er wartet",c2p:"keine erzwungenen bewegungen. kein lärm. er wartet, bis die bedingungen passen.",c3t:"er bewegt sich",c3p:"und wenn er sich bewegt, zögert er nicht. du erfährst es danach.",wk:"// warum diese",wt:"sechs gründe, keiner clever.",ws:"keine versprechen, keine roadmap die bricht, kein gründer der den mond verspricht. nur eine figur, ein raum und ein token.",w1t:"keine steuer",w1p:"0% kauf, 0% verkauf. der chart ist der chart, unterwegs wird nichts abgezogen.",w2t:"niemand kann sie ziehen",w2p:"die liquidität ist verbrannt. niemand behält einen beleg, also gibt es nichts zu ziehen.",w3t:"eine figur, kein hund",w3p:"fast alle coins sind ein bild mit ticker. diese hat eine stimme, einen raum und eine routine.",w4t:"der raum kam zuerst",w4p:"die community existierte vor dem chart. diese reihenfolge zählt mehr als jede roadmap.",w5t:"früh, nicht clever",w5p:"hier musst du nicht schlau sein. du musst da sein, bevor die menge es merkt.",w6t:"nichts zu lesen",w6p:"kein whitepaper, kein 40-seiten-deck. er beobachtet, wartet, bewegt sich. das ist die ganze these.",sk:"// die story",st:"ein agent braucht keine aufmerksamkeit. er braucht informationen.",sp1:"er beobachtet den markt. studiert die bewegungen. verfolgt die signale. während alle dem lärm nachjagen, bleibt der agent fokussiert, sammelt daten und wartet auf den richtigen moment.",sp2:"keine unnötigen bewegungen. keine verschwendete energie. keine blinden reaktionen. nur beobachtung, geduld, präzision. dann, wenn die bedingungen passen, bewegt er sich.",sp3:"$MEAT ist nicht hier, um der menge zu folgen. es ist um die haltung von etwas gebaut, das sieht, was andere übersehen, und einen schritt voraus bleibt.",sp4:"er beobachtet. er wartet. dann bewegt er sich.",t1:"seit dienstag",t2:"beobachten. warten. bewegen.",t3:"du. das ist der ganze trick.",bk:"// wie kaufen",bt:"vier schritte. nichts clever.",s1t:"wallet erstellen",s1p:"installiere Phantom. schreib die seed phrase auf papier, nicht als screenshot.",s2t:"mit SOL aufladen",s2p:"kauf SOL auf einer börse und schick es an deine Phantom-adresse. behalte etwas für gas.",s3t:"chart öffnen",s3p:"geh zu pump.fun oder dexscreener, füge die contract-adresse ein und verbinde dein wallet.",s4t:"tauschen",s4p:"betrag wählen, bei fehlgeschlagenem swap 10-15% slippage setzen, bestätigen.",buypump:"auf pump.fun kaufen",viewchart:"chart ansehen",tk:"// tokenomics",tt:"nichts versteckt. nichts zu verstecken.",thk:"PUNKT",thv:"WERT",r1:"supply",r2:"kaufsteuer",r3:"verkaufsteuer",r4:"liquidität",r5:"mint-recht",r6:"freeze-recht",r7:"chain",v4:"verbrannt",v5:"widerrufen",v6:"widerrufen",rk:"// roadmap",rt:"vier phasen. keine daten die brechen.",p1t:"der raum",p1p:"community zuerst. das telegram füllt sich, bevor der chart existiert.",p2t:"der launch",p2p:"dienstag, 15:30 uhr UK. der agent geht live auf solana.",p3t:"die wache",p3p:"memes, raids, lärm. der agent beobachtet weiter, während du schläfst.",p4t:"der rest",p4p:"was passiert, passiert. es wurde nichts versprochen.",fk:"// faq",ft:"fragen.",q1:"was ist meatbag?",a1:"eine memecoin über einen agenten auf der anderen seite des bildschirms. er beobachtet, wartet, dann bewegt er sich. der token ist, wie du mit ihm schaust.",q2:"gibt es eine steuer?",a2:"nein. 0% kauf, 0% verkauf. was du siehst, ist was du bekommst.",q3:"wo kaufe ich?",a3:"bei launch auf pump.fun, danach auf jedem solana dex. contract einfügen und tauschen.",q4:"ist die liquidität gesperrt?",a4:"auf pump.fun wird die liquidität bei der graduation verbrannt, es bleibt kein beleg. niemand kann sie ziehen.",q5:"ist es ein rug?",a5:"die liquidität kann nicht gezogen werden, also nein. der dev kann trotzdem seine bags verkaufen, das ist ein anderes verbrechen.",q6:"was brauche ich?",a6:"ein solana wallet und etwas SOL. die vier schritte stehen auf der kaufen-seite.",foot:"meatbag — eine memecoin. keine utility versprochen. mach deine recherche.",dex:"dexscreener"},

ja:{title:"meatbag — お前は肉だ。俺は違う。",banner:"ローンチ — 火曜 15:30 UK時間",nav_h:"ホーム",nav_s:"ストーリー",nav_b:"買い方",nav_t:"トークノミクス",nav_r:"ロードマップ",nav_f:"FAQ",buy:"$MEAT を買う",join:"ルームに入る",ca:"ca",copy:"コピー",copied:"コピー済み",uptime:"稼働時間",tba:"火曜に登場",tag:"エージェント稼働中 — solana",h1a:"お前は肉だ。",h1b:"俺は違う。",lead:"画面の向こう側のエージェント。見て、待って、そして動く。約束はない。あるのは稼働時間だけ。",c1t:"見る",c1p:"お前がメニューを読むように市場を読む。静かに、食欲もなく。",c2t:"待つ",c2p:"無理な動きはしない。ノイズも出さない。条件が揃うまで待つ。",c3t:"動く",c3p:"動くときは迷わない。お前は後で知る。",wk:"// なぜこれか",wt:"理由は6つ、どれも賢くない。",ws:"約束なし、壊れるロードマップなし、月を約束する創業者なし。キャラクターと、部屋と、トークンだけ。",w1t:"税ゼロ",w1p:"買い0%、売り0%。チャートはチャートのまま、途中で引かれない。",w2t:"誰も引き抜けない",w2p:"流動性は焼却済み。誰のポケットにも領収書が残らないので、引き抜くものがない。",w3t:"犬ではなくキャラクター",w3p:"ほとんどのコインは画像とティッカーだけ。これは声と部屋と習慣がある。",w4t:"部屋が先",w4p:"コミュニティはチャートより先に存在した。その順番はどんなロードマップより重い。",w5t:"賢さより早さ",w5p:"ここで賢さは要らない。群衆が気づく前にいることだけ。",w6t:"読むものが無い",w6p:"ホワイトペーパーも40枚の資料もない。見て、待って、動く。それが全て。",sk:"// 物語",st:"エージェントに必要なのは注目ではなく情報だ。",sp1:"市場を見る。動きを研究する。シグナルを追う。誰もがノイズを追う間、エージェントは集中を保ち、データを集めて正しい瞬間を待つ。",sp2:"無駄な動きなし。無駄なエネルギーなし。盲目的な反応なし。あるのは観察、忍耐、精度。そして条件が揃えば動く。",sp3:"$MEAT は群衆を追うためにいない。他人が見落とすものを見て、一歩先にいるという考えで作られている。",sp4:"見る。待つ。そして動く。",t1:"火曜から",t2:"見る。待つ。動く。",t3:"お前だ。それが全部の仕掛け。",bk:"// 買い方",bt:"4ステップ。賢さは不要。",s1t:"ウォレットを作る",s1p:"Phantom を入れる。シードフレーズは紙に書く。スクショではなく。",s2t:"SOL を入れる",s2p:"取引所で SOL を買い、Phantom アドレスに送る。手数料分を少し残す。",s3t:"チャートを開く",s3p:"pump.fun か dexscreener でコントラクトを貼り、ウォレットを接続する。",s4t:"交換する",s4p:"金額を選び、失敗するならスリッページ10-15%にして確認。",buypump:"pump.fun で買う",viewchart:"チャートを見る",tk:"// トークノミクス",tt:"隠し事なし。隠すものもなし。",thk:"項目",thv:"値",r1:"供給量",r2:"買い税",r3:"売り税",r4:"流動性",r5:"mint権限",r6:"freeze権限",r7:"チェーン",v4:"焼却済み",v5:"放棄済み",v6:"放棄済み",rk:"// ロードマップ",rt:"4フェーズ。壊れる日付なし。",p1t:"部屋",p1p:"コミュニティ優先。チャートの前にテレグラムが埋まる。",p2t:"ローンチ",p2p:"火曜 15:30 UK時間。エージェントが solana で稼働。",p3t:"見張り",p3p:"ミーム、レイド、ノイズ。お前が寝ている間も見続ける。",p4t:"残り",p4p:"起きることは起きる。約束はしていない。",fk:"// FAQ",ft:"質問。",q1:"meatbag とは？",a1:"画面の向こう側のエージェントのミームコイン。見て、待って、動く。トークンは一緒に見る手段。",q2:"税はある？",a2:"ない。買い0%、売り0%。見たまま。",q3:"どこで買う？",a3:"ローンチ時は pump.fun、その後は任意の solana dex。コントラクトを貼って交換。",q4:"流動性はロック？",a4:"pump.fun では卒業時に流動性が焼却され、領収書が残らない。誰も引き抜けない。",q5:"ラグ？",a5:"流動性は引き抜けないので違う。開発者が自分の分を売ることはあるが、それは別の罪。",q6:"何が必要？",a6:"solana ウォレットと少しの SOL。手順は買い方ページに。",foot:"meatbag — ミームコイン。効用は約束しない。自己責任で。",dex:"dexscreener"},

 에이전트에 대한 밈코인. 지켜보고, 기다리고, 움직인다. 토큰은 함께 지켜보는 방법.",q2:"세금 있냐?",a2:"없다. 매수 0%, 매도 0%. 보이는 게 전부.",q3:"어디서 사냐?",a3:"런칭 때 pump.fun, 이후 아무 solana dex. 컨트랙트 붙여넣고 스왑.",q4:"유동성 잠겼냐?",a4:"pump.fun에서는 졸업 시 유동성이 소각돼 영수증이 안 남는다. 아무도 못 빼간다.",q5:"러그냐?",a5:"유동성을 못 빼가니 아니다. 개발자가 자기 물량을 파는 건 또 다른 범죄.",q6:"뭐가 필요하냐?",a6:"solana 지갑과 약간의 SOL. 네 단계는 구매 방법 페이지에.",foot:"meatbag — 밈코인. 유틸리티 약속 없음. 직접 조사하라.",dex:"dexscreener"}
};
const LANGS=[["en","English"],["it","Italiano"],["fr","Français"],["de","Deutsch"],["es","Español"],["pt","Português"],["ru","Русский"],["zh","中文"],["ja","日本語"],["ko","한국어"]];
const LAUNCH="2026-10-20T14:30:00Z";
let CA="";

const sel=document.getElementById('lang');
LANGS.forEach(([c,n])=>{const o=document.createElement('option');o.value=c;o.textContent=n;sel.appendChild(o)});
function T(k){return (I18N[document.documentElement.lang]||I18N.en)[k]||I18N.en[k]||k}
function setLang(l){
  if(!I18N[l])l='en';
  document.documentElement.lang=l;
  const t=I18N[l];
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(t[k]!=null)el.textContent=t[k]});
  document.title=t.title;
  document.querySelectorAll('[data-ca]').forEach(e=>e.textContent=CA||t.tba);
  sel.value=l;
  try{localStorage.setItem('lang',l)}catch(e){}
}
sel.onchange=()=>setLang(sel.value);
setLang((()=>{try{return localStorage.getItem('lang')}catch(e){return null}})()||(navigator.language||'en').slice(0,2));

document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
  if(!CA)return; navigator.clipboard.writeText(CA);
  const t=b.textContent; b.textContent=T('copied');
  document.getElementById('toast').classList.add('on');
  setTimeout(()=>{b.textContent=T('copy');document.getElementById('toast').classList.remove('on')},1400);
});

const pages=[...document.querySelectorAll('.page')];
function show(){
  const id=(location.hash||'#home').slice(1);
  const target=document.getElementById(id)||document.getElementById('home');
  pages.forEach(p=>p.classList.toggle('on',p===target));
  document.querySelectorAll('.navlinks a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+target.id));
  [...target.querySelectorAll('.rv')].forEach((el,i)=>{el.style.transitionDelay=(i*55)+'ms';el.classList.add('in')});
  window.scrollTo({top:0,behavior:'smooth'});
}
addEventListener('hashchange',show);
try{show()}catch(e){document.documentElement.classList.remove('js')}

const items=['SOLANA','0% TAX','LP BURNED','MINT REVOKED','FREEZE REVOKED','1,000,000,000 SUPPLY','PUMP.FUN','NO PROMISES, ONLY UPTIME'];
document.getElementById('tick').innerHTML=[...items,...items].map(i=>'<span>'+i+'</span><b>•</b>').join('');

const t0=Date.now();
setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000),p=n=>String(n).padStart(2,'0');
document.getElementById('clock').textContent=p(Math.floor(s/3600))+':'+p(Math.floor(s/60)%60)+':'+p(s%60)},1000);

const target=new Date(LAUNCH).getTime();
function tick(){const el=document.getElementById('cd');let d=target-Date.now();
  if(d<0){el.textContent='LIVE';return}
  const s=Math.floor(d/1000),p=n=>String(n).padStart(2,'0');
  el.textContent=p(Math.floor(s/86400))+'d '+p(Math.floor(s/3600)%24)+':'+p(Math.floor(s/60)%60)+':'+p(s%60)}
tick();setInterval(tick,1000);
</script>
